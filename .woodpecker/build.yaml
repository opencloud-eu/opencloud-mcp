# the release artifacts of every change, binaries and MCP bundle, with the tools of mise.toml,
# beside the tests
when:
  - event: [push, manual]
    branch: ${CI_REPO_DEFAULT_BRANCH}
  - event: pull_request

steps:
  - name: build
    image: docker.io/jdxcode/mise:2026.10.25-debian
    # skipped on the next-release PR, which only changes the changelog; the workflow still reports
    when:
      - evaluate: |
          !(CI_COMMIT_SOURCE_BRANCH matches "next-release/(main|stable-*)" && CI_COMMIT_AUTHOR == "openclouders")
    environment:
      HTTP_PROXY:
        from_secret: ci_http_proxy
      HTTPS_PROXY:
        from_secret: ci_http_proxy
      MISE_TRUSTED_CONFIG_PATHS: ${CI_WORKSPACE}
    commands:
      # what a release puts on GitHub: the binaries and the MCP bundle, which the task validates
      # and whose launcher it starts
      - mise run mcpb
