# the binary of every change, with the Go of mise.toml, beside the tests
when:
  - event: [push, manual]
    branch: ${CI_REPO_DEFAULT_BRANCH}
  - event: pull_request
    evaluate: |
      !(CI_COMMIT_SOURCE_BRANCH matches "next-release/(main|stable-*)" && CI_COMMIT_AUTHOR == "openclouders")

steps:
  - name: build
    image: docker.io/jdxcode/mise:2026.10.25-debian
    environment:
      HTTP_PROXY:
        from_secret: ci_http_proxy
      HTTPS_PROXY:
        from_secret: ci_http_proxy
      MISE_TRUSTED_CONFIG_PATHS: ${CI_WORKSPACE}
      # only Go, the task would install golangci-lint too
      MISE_TASK_RUN_AUTO_INSTALL: 'false'
    commands:
      - mise install go
      - mise run build
      - bin/opencloud-mcp --version
