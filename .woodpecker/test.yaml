# lint, unit tests and a build of every change; the live tests need the compose demo and run only
# on a developer's machine (mise run test:live)
variables:
  # the Go of mise.toml and of GO_VERSION in the Dockerfile; Debian, so -race finds its C compiler
  - &golang_image 'docker.io/golang:1.27.3'
  - &environment
    HTTP_PROXY:
      from_secret: ci_http_proxy
    HTTPS_PROXY:
      from_secret: ci_http_proxy

when:
  - event: [push, manual]
    branch: ${CI_REPO_DEFAULT_BRANCH}
  - event: tag
  - event: pull_request
    # the next-release PR of the release helper only changes the changelog
    evaluate: |
      !(CI_COMMIT_SOURCE_BRANCH matches "next-release/(main|stable-*)" && CI_COMMIT_AUTHOR == "openclouders")

# the Go home as workspace, so the steps share the module cache
# the Go home as workspace, so the steps share the module cache
workspace:
  base: /go
  path: src/opencloud-mcp

steps:
  - name: tidy
    image: *golang_image
    environment: *environment
    commands:
      - go mod tidy -diff

  - name: lint
    image: *golang_image
    environment: *environment
    commands:
      - go vet ./...
      # the golangci-lint of mise.toml, built with the Go above so it reads this Go's syntax
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
      - golangci-lint run ./...

  - name: test
    image: *golang_image
    environment: *environment
    commands:
      # the live tests skip without the demo
      - go test -race ./...

  - name: build
    image: *golang_image
    environment: *environment
    commands:
      - go build -trimpath -o bin/opencloud-mcp ./cmd/opencloud-mcp
      - bin/opencloud-mcp --version
