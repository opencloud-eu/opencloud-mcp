# a push to main updates the next-release PR, whose merge tags the release; the tag builds the
# binaries and puts them on the GitHub release
when:
  - event: push
    branch: ${CI_REPO_DEFAULT_BRANCH}
  - event: tag

depends_on:
  - test

steps:
  - name: release-helper
    image: woodpeckerci/plugin-ready-release-go:latest
    settings:
      git_email: devops@opencloud.eu
      forge_type: github
      forge_token:
        from_secret: github_token
    when:
      - event: push

  - name: binaries
    image: docker.io/jdxcode/mise:2026.10.25-debian
    environment:
      HTTP_PROXY:
        from_secret: ci_http_proxy
      HTTPS_PROXY:
        from_secret: ci_http_proxy
      MISE_TRUSTED_CONFIG_PATHS: ${CI_WORKSPACE}
    commands:
      - mise install
      - VERSION=$${CI_COMMIT_TAG} mise run dist
    when:
      - event: tag

  # the release helper made the release with its notes; this adds the binaries and their checksums
  - name: github-release
    image: woodpeckerci/plugin-release
    settings:
      api_key:
        from_secret: github_token
      files:
        - dist/*
      checksum:
        - sha256
    when:
      - event: tag
