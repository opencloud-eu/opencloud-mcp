# builds the image of the Dockerfile for both platforms; nothing is pushed while the repository
# is private
when:
  - event: [push, manual]
    branch: ${CI_REPO_DEFAULT_BRANCH}
  - event: tag
  - event: pull_request
    evaluate: |
      !(CI_COMMIT_SOURCE_BRANCH matches "next-release/(main|stable-*)" && CI_COMMIT_AUTHOR == "openclouders")

depends_on:
  - test

steps:
  - name: dryrun
    image: woodpeckerci/plugin-docker-buildx:latest
    settings:
      dry_run: true
      dockerfile: Dockerfile
      platforms: linux/amd64,linux/arm64
      pull_image: false
      repo: opencloudeu/opencloud-mcp
      tags: ${CI_COMMIT_TAG=dev}
      build_args:
        - VERSION=${CI_COMMIT_TAG=dev}
      http_proxy:
        from_secret: ci_http_proxy
      https_proxy:
        from_secret: ci_http_proxy
