[tools]
go = "1.27.3"
golangci-lint = "2.15.0"

[tasks.build]
description = "the opencloud-mcp binary in bin/"
run = "go build -trimpath -o bin/opencloud-mcp ./cmd/opencloud-mcp"

[tasks.test]
description = "the unit tests against the in-repo fake OpenCloud, and the live test, which skips without a local OpenCloud"
run = "go test -race ./..."

[tasks."test:live"]
description = "the tests with the live test against the compose demo, as alice with bob as the second user"
run = '''
eval "$(docker compose logs --no-log-prefix app-tokens | grep '^export ' | tail -n 2)"
go test -race -count=1 ./...
'''

[tasks.demo]
description = "the demo at http://localhost in the foreground, Ctrl-C stops it: OpenCloud, Rauthy, Collabora, Tika, this server and LibreChat"
run = "docker compose up --build"

[tasks."demo:tokens"]
description = "alice's and bob's app tokens as shell exports"
run = "docker compose logs --no-log-prefix app-tokens | grep '^export ' | tail -n 2"

[tasks."demo:reset"]
description = "the demo down, its data and its image of this server deleted, for a start from scratch"
run = "docker compose down --remove-orphans --volumes --rmi local"

[tasks.tidy]
description = "fails when go.mod or go.sum are not tidy"
run = "go mod tidy -diff"

[tasks.dist]
description = "the release binaries for Linux, macOS and Windows on amd64 and arm64 in dist/, VERSION names them"
env = { CGO_ENABLED = "0" }
run = '''
version=${VERSION:-dev}
rm -rf dist
for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
  os=${target%/*} arch=${target#*/} ext=
  [ "$os" = windows ] && ext=.exe
  GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=${version#v}" \
    -o "dist/opencloud-mcp-$version-$os-$arch$ext" ./cmd/opencloud-mcp
done
'''

[tasks.lint]
description = "go vet and golangci-lint"
run = ["go vet ./...", "golangci-lint run ./..."]

[tasks.image]
description = "the container image opencloud-mcp:dev"
run = "docker build -t opencloud-mcp:dev ."

[tasks.run]
description = "the server on stdio, configured by OPENCLOUD_URL, OPENCLOUD_USER and OPENCLOUD_APP_TOKEN"
run = "go run ./cmd/opencloud-mcp"

[tasks.kql]
description = "OpenCloud's search parity report into internal/kql, for the OpenCloud version in internal/kql/version"
run = 'curl -fsSL "https://raw.githubusercontent.com/opencloud-eu/opencloud/v$(cat internal/kql/version)/services/search/pkg/parity/README.md" -o internal/kql/parity.md'
