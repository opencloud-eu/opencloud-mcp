# lint, unit tests and a build of every change, with the Go and golangci-lint of mise.toml; the
# live tests need the compose demo and run only on a developer's machine (mise run test:live)
variables:
  - &mise_image 'docker.io/jdxcode/mise:2026.10.25-debian'
  - &environment
    HTTP_PROXY:
      from_secret: ci_http_proxy
    HTTPS_PROXY:
      from_secret: ci_http_proxy
    # the tools and the Go caches live in the workspace, so the steps install them once
    MISE_DATA_DIR: /woodpecker/mise
    MISE_CACHE_DIR: /woodpecker/mise/cache
    GOPATH: /woodpecker/go
    GOCACHE: /woodpecker/go/cache
    MISE_TRUSTED_CONFIG_PATHS: ${CI_WORKSPACE}

when:
  - event: [push, manual]
    branch: ${CI_REPO_DEFAULT_BRANCH}
  - event: tag
  - event: pull_request
    # the next-release PR of the release helper only changes the changelog
    evaluate: |
      !(CI_COMMIT_SOURCE_BRANCH matches "next-release/(main|stable-*)" && CI_COMMIT_AUTHOR == "openclouders")

steps:
  - name: install
    image: *mise_image
    environment: *environment
    commands:
      - mise install
      - mise run tidy

  - name: lint
    image: *mise_image
    environment: *environment
    commands:
      - mise run lint

  - name: test
    image: *mise_image
    environment: *environment
    commands:
      # -race needs a C compiler, which the image has not; the live tests skip without the demo
      - apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends gcc libc6-dev >/dev/null
      - mise run test

  - name: build
    image: *mise_image
    environment: *environment
    commands:
      - mise run build
      - bin/opencloud-mcp --version
